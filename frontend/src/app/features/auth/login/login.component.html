<div class="login">
  <mat-card class="login__card" appearance="outlined">
    <div class="login__brand">
      @if (branding.logoUrl(); as logo) {
        <img class="login__logo" [src]="logo" [alt]="branding.portalTitle()" />
      } @else {
        <span class="login__brand-name">{{ branding.portalTitle() }}</span>
      }
    </div>

    <mat-card-content>
      <p class="login__subtitle">{{ 'auth.signInSubtitle' | transloco }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'auth.email' | transloco }}</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'auth.password' | transloco }}</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || submitting()">
          @if (submitting()) {
            <mat-spinner diameter="20" />
          } @else {
            {{ 'auth.signIn' | transloco }}
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
